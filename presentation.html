# Background (章节大标题 Using xaringan
前人的研究空白
如果发现贫困程度和精神病发病率有关系并且更穷苦的人发病率更高（经济压力--工作压力大--心理健康下降），可以让政府意识到它应该合理分配资源，而不是平均分配，有效降低精神疾病发病率

---

# Method&amp;Model（xaringan

Linear correlation：
y=b0+b1*SIMD
(b0代表什么，b1代表什么，SIMD代表什么，patients rates间接代表了发病数量，p value小于0.05--两者之间有显著性线性关联（H0：没有线性关系）：p大于0.05，不拒绝原假设（H0）--没有线性关系，p小于0.05，拒绝原假设--有线性关系）

 
#Result：

Code+Function:


``` r
library(tidyverse)
deprivation &lt;- read_csv("data/deprivation.csv")
```

```
## Rows: 6075 Columns: 14
## ── Column specification ────────────────────────────────────────────────────────
## Delimiter: ","
## chr (7): FinancialYear, HBR, HBRQF, Dataset, DatasetQF, HospitalResidentsCou...
## dbl (7): SIMD, DischargeCount, DischargeRates, PatientsCount, PatientsRates,...
## 
## ℹ Use `spec()` to retrieve the full column specification for this data.
## ℹ Specify the column types or set `show_col_types = FALSE` to quiet this message.
```

``` r
plot_data &lt;- deprivation %&gt;%
  filter(
    Dataset == "SMR04",
    HBR == "S92000003",
    SIMD %in% 1:5,
    !is.na(PatientsRates)
  ) %&gt;%
  mutate(SIMD = as.numeric(as.character(SIMD)))
model &lt;- lm(PatientsRates ~ SIMD, data = plot_data)
b0 &lt;- coef(model)[1]
b1 &lt;- coef(model)[2]
cat(
  "Predicted y = ",
  round(b0, 2),
  ifelse(b1 &lt; 0, " - ", " + "),
  abs(round(b1, 2)),
  " * SIMD\n",
  sep = ""
)
```

```
## Predicted y = 573.82 - 86.67 * SIMD
```




p- value：

``` r
# p-value for SIMD coefficient
p &lt;- summary(model)$coefficients["SIMD", "Pr(&gt;|t|)"]
print(p)
```

```
## [1] 3.220616e-40
```

``` r
plot_data &lt;- deprivation %&gt;%
  filter(
    Dataset == "SMR04",
    HBR == "S92000003",
    SIMD %in% 1:5,
    !is.na(PatientsRates)
  ) %&gt;%
  mutate(SIMD = as.numeric(SIMD))
model &lt;- lm(PatientsRates ~ SIMD, data = plot_data)
intercept &lt;- coef(model)[1]
slope &lt;- coef(model)[2]
cat(
  "Linear Regression Equation:\n",
  "y = ", round(intercept, 2),
  ifelse(slope &lt; 0, " - ", " + "),
  abs(round(slope, 2)), "x\n",
  sep = ""
)
```

```
## Linear Regression Equation:
## y = 573.82 - 86.67x
```

``` r
ggplot(plot_data,
       aes(x = SIMD, y = PatientsRates)) +

  geom_point(
    aes(colour = factor(SIMD)),
    alpha = 0.4,
    size = 2
  ) +

  geom_smooth(
    method = "lm",
    formula = y ~ x,
    se = FALSE,
    colour = "black",
    linewidth = 1.2
  ) +

  scale_colour_manual(
    values = c(
      "1" = "#E63946",
      "2" = "#457B9D",
      "3" = "#2A9D8F",
      "4" = "#9B59B6",
      "5" = "#F4A261"
    ),
    name = "SIMD"
  ) +

  scale_x_continuous(breaks = 1:5) +

  labs(
    title = "Linear Regression: SIMD and Mental Health Inpatient Rates",
    subtitle = "Scotland, 1997/98–2023/24",
    x = "SIMD (1 = Most Deprived, 5 = Least Deprived)",
    y = "Patients per 100,000 Population"
  ) +

  theme_minimal()
```

``` r
plot_data &lt;- deprivation %&gt;%
  filter(
    Dataset == "SMR04",
    HBR == "S92000003",
    SIMD %in% 1:5,
    !is.na(PatientsRates)
  ) %&gt;%
  mutate(SIMD = factor(SIMD))
ggplot(plot_data, aes(x = PatientsRates)) +

  geom_histogram(
    aes(
      y = after_stat(density),
      fill = SIMD
    ),
    bins = 8,
    alpha = 0.4,
    color = "white"
  ) +

  geom_density(
    aes(color = SIMD),
    linewidth = 1.2,
    fill = NA
  ) +

  facet_wrap(
    ~ SIMD,
    ncol = 3
  ) +

  scale_fill_manual(
    values = c(
      "1" = "#E63946",
      "2" = "#457B9D",
      "3" = "#2A9D8F",
      "4" = "#9B59B6",
      "5" = "#F4A261"
    )
  ) +

  scale_color_manual(
    values = c(
      "1" = "#E63946",
      "2" = "#457B9D",
      "3" = "#2A9D8F",
      "4" = "#9B59B6",
      "5" = "#F4A261"
    )
  ) +

  labs(
    title = "Distribution of Mental Health Inpatient Rates by SIMD",
    subtitle = "Scotland, 1997/98–2023/24",
    x = "Patients per 100,000 Population",
    y = "Density"
  ) +

  theme_minimal() +

  theme(
    legend.position = "none"
  )
```
